name: Pull Request Validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commits
        uses: helpers4/action/conventional-commits@main
        with:
          checkout: "true"
          pr-comment: "error"

  version-bump-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check touched features bumped their version
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          MERGE_BASE=$(git merge-base "${BASE_SHA}" HEAD)
          echo "::notice::Diff base = ${MERGE_BASE} → HEAD ($(git rev-parse HEAD))"

          # Computed once, reused per-feature below instead of re-running git
          # diff in the loop. test/ is included only so a test-only PR still
          # resolves a feature name to check (and reports "no bump needed"
          # correctly) — it never counts toward requiring a bump itself.
          touched_files=$(git diff --name-only "${MERGE_BASE}..HEAD" -- src/ test/)

          mapfile -t names < <(echo "$touched_files" | awk -F/ '{print $2}' | sort -u)

          FAILED=0
          for name in "${names[@]}"; do
            manifest="src/${name}/devcontainer-feature.json"
            [ -f "$manifest" ] || continue # feature removed on this branch

            new_version=$(jq -r '.version' "$manifest")
            old_version=$(git show "${MERGE_BASE}:${manifest}" 2>/dev/null | jq -r '.version' 2>/dev/null || echo "")

            # A version bump is required for anything under src/<name>/
            # except its README — nothing under test/<name>/ counts,
            # including test.sh itself. Tests and CI are invisible to the
            # consumer: bumping for them publishes a new GHCR tag and
            # triggers a docs rebuild for a change nobody running the
            # feature can actually see.
            non_readme_touched=$(echo "$touched_files" \
              | grep -E "^src/${name}/" | grep -v "^src/${name}/README\.md$" || true)

            if [ -z "$old_version" ]; then
              echo "✅ ${name}: new feature, no bump required"
            elif [ "$old_version" = "$new_version" ]; then
              if [ -z "$non_readme_touched" ]; then
                echo "ℹ️  ${name}: README/test-only change, no bump needed (still ${new_version})"
              else
                echo "❌ ${name}: touched but version unchanged (${new_version})"
                FAILED=1
              fi
            else
              echo "✅ ${name}: ${old_version} → ${new_version}"
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "One or more touched features didn't bump 'version' in devcontainer-feature.json."
            echo "release.yml only publishes a feature whose version changed — bump it (patch by"
            echo "default), once for the whole branch. See AGENTS.md 'Modifying an existing"
            echo "feature — version bump'."
          fi
          exit "$FAILED"

  test-features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: essential-dev
            baseImage: mcr.microsoft.com/devcontainers/base:debian
          - features: essential-dev
            baseImage: ubuntu:latest
          - features: essential-dev
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu
          - features: shell-history-per-project
            baseImage: mcr.microsoft.com/devcontainers/base:debian
          - features: shell-history-per-project
            baseImage: ubuntu:latest
          - features: shell-history-per-project
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu
          - features: git-absorb
            baseImage: mcr.microsoft.com/devcontainers/base:debian
          - features: git-absorb
            baseImage: ubuntu:latest
          - features: git-absorb
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu
          - features: bitwarden-secrets-manager
            baseImage: ubuntu:latest
          - features: bitwarden-secrets-manager
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu
          - features: angular-dev
            baseImage: mcr.microsoft.com/devcontainers/javascript-node:20
          - features: package-auto-install
            baseImage: mcr.microsoft.com/devcontainers/javascript-node:20
          - features: helpers4-common
            baseImage: mcr.microsoft.com/devcontainers/base:debian
          - features: helpers4-common
            baseImage: ubuntu:latest
          - features: claude-dev
            baseImage: ubuntu:latest
          - features: claude-dev
            # test.sh itself always runs as root regardless of which user
            # h4_detect_user resolves for the feature's own postStartCommand
            # (root on ubuntu:latest — it actually resolves the built-in
            # "ubuntu" user there, uid 1000 — matches "vscode" here), so only
            # a base image where the container's own default process user
            # matches lets test.sh's write check meaningfully exercise the
            # named-volume EACCES regression.
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu
          - features: pnpm-store
            baseImage: mcr.microsoft.com/devcontainers/typescript-node:20
          - features: pnpm-store
            baseImage: ubuntu:latest
          - features: vite-plus
            baseImage: mcr.microsoft.com/devcontainers/typescript-node:20
          - features: playwright-dev
            baseImage: mcr.microsoft.com/devcontainers/typescript-node:20
          - features: nub
            baseImage: mcr.microsoft.com/devcontainers/typescript-node:20
          - features: typescript-dev
            baseImage: mcr.microsoft.com/devcontainers/typescript-node:20
          - features: auto-header
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu
          - features: peon-ping
            baseImage: ubuntu:latest
          - features: peon-ping
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu
          - features: dotfiles-sync
            baseImage: mcr.microsoft.com/devcontainers/base:debian
          - features: dotfiles-sync
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu
          - features: github-dev
            baseImage: mcr.microsoft.com/devcontainers/base:debian
          - features: github-dev
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu
          - features: copilot-dev
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu
          - features: mistral-dev
            baseImage: ubuntu:latest
          - features: mistral-dev
            # Same rationale as claude-dev above — exercises the named-volume
            # EACCES regression on a base image with a non-root default user.
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu
          - features: cline-dev
            baseImage: ubuntu:latest
          - features: org-workspace
            baseImage: mcr.microsoft.com/devcontainers/base:debian

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Create mount sources for dotfiles-sync
        if: matrix.features == 'dotfiles-sync'
        # All bind sources declared in src/dotfiles-sync/devcontainer-feature.json
        # must exist on the host or `docker run` aborts before the test runs.
        run: |
          mkdir -p ~/.ssh ~/.gnupg \
                   ~/.config/git ~/.config/gh ~/.config/pnpm ~/.config/pip \
                   ~/.cargo ~/.aws ~/.kube ~/.docker
          touch ~/.gitconfig ~/.gitignore_global ~/.npmrc ~/.yarnrc.yml \
                ~/.config/pnpm/rc ~/.config/gh/config.yml ~/.config/gh/hosts.yml \
                ~/.cargo/config.toml ~/.config/pip/pip.conf \
                ~/.aws/config ~/.kube/config ~/.docker/config.json

      - name: "Test feature '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        # --skip-scenarios: scenario tests (test/<name>/scenarios.json) define
        # their own image and run once per feature in the test-scenarios job
        # below, not once per baseImage here — without this flag they'd
        # silently re-run (wastefully, and against the wrong image) on every
        # matrix entry for a feature that has any.
        run: devcontainer features test --features ${{ matrix.features }} --base-image ${{ matrix.baseImage }} --skip-scenarios .

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # A scenario tests a non-default option combination that the
          # autogenerated test.sh (default options only) never exercises —
          # see test/<name>/scenarios.json's own comments for why each one
          # exists. Add an entry here whenever a feature gains a
          # scenarios.json; see AGENTS.md "Testing non-default options".
          - features: claude-dev
          - features: cline-dev
          - features: mistral-dev
          - features: peon-ping

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: "Test '${{ matrix.features }}' scenarios"
        run: devcontainer features test --features ${{ matrix.features }} --skip-autogenerated .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run ShellCheck on install scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: src
          # gh-auth.sh is sourced from /etc/profile.d/, so it can't carry a
          # shebang — shellcheck's SC2148 ("target shell unknown") on that is
          # expected and not fixable without breaking how the file is used.
          ignore_names: "gh-auth.sh"

      - name: Verify AGENTS.md's feature table matches manifest versions
        run: |
          # AGENTS.md hand-maintains a Ver column that duplicates each
          # feature's own devcontainer-feature.json version, with nothing
          # else keeping the two in sync — this is exactly the kind of
          # duplication that let PR#52 drift silently. Catch it here instead.
          FAILED=0
          while IFS='|' read -r _ name_field ver_field _; do
            name=$(echo "$name_field" | tr -d ' `')
            ver=$(echo "$ver_field" | xargs)
            [ -z "$name" ] && continue
            manifest="src/${name}/devcontainer-feature.json"
            [ -f "$manifest" ] || continue
            actual=$(jq -r '.version' "$manifest")
            if [ "$ver" != "$actual" ]; then
              echo "❌ AGENTS.md says ${name} is ${ver}, manifest says ${actual}"
              FAILED=1
            fi
          done < <(grep -E '^\| `' AGENTS.md)
          if [ "$FAILED" -eq 0 ]; then
            echo "✅ AGENTS.md's feature table matches every manifest version"
          fi
          exit $FAILED

  pr-comment:
    runs-on: ubuntu-latest
    needs: [conventional-commits, version-bump-check, test-features, test-scenarios, shellcheck]
    if: always()
    steps:
      - name: Update PR comment
        uses: helpers4/action/pr-status-comment@main
        with:
          jobs: |
            {
              "🧾 Conventional Commits": "${{ needs.conventional-commits.result }}",
              "🔖 Version Bump": "${{ needs.version-bump-check.result }}",
              "🧪 Feature Tests": "${{ needs.test-features.result }}",
              "🧪 Scenario Tests": "${{ needs.test-scenarios.result }}",
              "🐚 ShellCheck": "${{ needs.shellcheck.result }}"
            }
