name: "CI - Test Features"
on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        include:
          # helpers4-common - must work on any base image (it's the bootstrap)
          - features: helpers4-common
            baseImage: mcr.microsoft.com/devcontainers/base:debian
          - features: helpers4-common
            baseImage: ubuntu:latest

          # essential-dev - works on any base image
          - features: essential-dev
            baseImage: mcr.microsoft.com/devcontainers/base:debian
          - features: essential-dev
            baseImage: ubuntu:latest
          - features: essential-dev
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu

          # shell-history-per-project - works on any base image
          - features: shell-history-per-project
            baseImage: mcr.microsoft.com/devcontainers/base:debian
          - features: shell-history-per-project
            baseImage: ubuntu:latest
          - features: shell-history-per-project
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu

          # git-absorb - works on any base image
          - features: git-absorb
            baseImage: mcr.microsoft.com/devcontainers/base:debian
          - features: git-absorb
            baseImage: ubuntu:latest
          - features: git-absorb
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu

          # bitwarden-secrets-manager - works on any base image
          - features: bitwarden-secrets-manager
            baseImage: ubuntu:latest
          - features: bitwarden-secrets-manager
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu

          # angular-dev - requires Node.js
          - features: angular-dev
            baseImage: mcr.microsoft.com/devcontainers/javascript-node:20

          # package-auto-install - requires Node.js
          - features: package-auto-install
            baseImage: mcr.microsoft.com/devcontainers/javascript-node:20

          # pnpm-store - config only; test with and without pnpm in the image
          - features: pnpm-store
            baseImage: mcr.microsoft.com/devcontainers/typescript-node:20
          - features: pnpm-store
            baseImage: ubuntu:latest

          # vite-plus - requires Node.js
          - features: vite-plus
            baseImage: mcr.microsoft.com/devcontainers/typescript-node:20

          # playwright-dev — requires Node.js (dependsOn typescript-dev)
          - features: playwright-dev
            baseImage: mcr.microsoft.com/devcontainers/typescript-node:20

          # nub — requires Node.js (dependsOn the official node feature)
          - features: nub
            baseImage: mcr.microsoft.com/devcontainers/typescript-node:20

          # typescript-dev — depends on essential-dev:1 via dependsOn (hard dep)
          - features: typescript-dev
            baseImage: mcr.microsoft.com/devcontainers/typescript-node:20

          # claude-dev — IDE-config-only feature
          - features: claude-dev
            baseImage: ubuntu:latest
          # ...and on a base image where the container's own default process
          # user matches what h4_detect_user resolves for the feature (test.sh
          # itself always runs as root otherwise, regardless of which user
          # postStartCommand ran as — that mismatch can't exercise the
          # named-volume EACCES regression the write-test guards against).
          - features: claude-dev
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu

          # mistral-dev — IDE-config-only feature
          - features: mistral-dev
            baseImage: ubuntu:latest
          - features: mistral-dev
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu

          # cline-dev — IDE-config-only feature
          - features: cline-dev
            baseImage: ubuntu:latest

          # auto-header - requires jq (installed by helpers4-common)
          - features: auto-header
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu

          # peon-ping - works on any base image with curl and python3
          - features: peon-ping
            baseImage: ubuntu:latest
          - features: peon-ping
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu

          # github-dev - requires common-utils (curl, ca-certificates)
          - features: github-dev
            baseImage: mcr.microsoft.com/devcontainers/base:debian
          - features: github-dev
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu

          # dotfiles-sync - works on any base image
          - features: dotfiles-sync
            baseImage: mcr.microsoft.com/devcontainers/base:debian
          - features: dotfiles-sync
            baseImage: mcr.microsoft.com/devcontainers/base:ubuntu

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install latest devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Create mount sources for dotfiles-sync
        if: matrix.features == 'dotfiles-sync'
        # All bind sources declared in src/dotfiles-sync/devcontainer-feature.json
        # must exist on the host or `docker run` aborts before the test runs.
        run: |
          mkdir -p ~/.ssh ~/.gnupg \
                   ~/.config/git ~/.config/gh ~/.config/pnpm ~/.config/pip \
                   ~/.cargo ~/.aws ~/.kube ~/.docker
          touch ~/.gitconfig ~/.gitignore_global ~/.npmrc ~/.yarnrc.yml \
                ~/.config/pnpm/rc ~/.config/gh/config.yml ~/.config/gh/hosts.yml \
                ~/.cargo/config.toml ~/.config/pip/pip.conf \
                ~/.aws/config ~/.kube/config ~/.docker/config.json

      - name: Test feature '${{ matrix.features }}' against '${{ matrix.baseImage }}'
        run: devcontainer features test --features ${{ matrix.features }} --base-image ${{ matrix.baseImage }} .
