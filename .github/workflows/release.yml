name: "Release"

# Auto-release: when a PR is merged into main, detect every feature whose
# `version` field changed in `src/<feature>/devcontainer-feature.json`. The
# `devcontainers/action` step always scans the full `./src` tree, but GHCR
# publishing is idempotent: only versions not already present on GHCR are
# pushed, so unchanged features are effectively skipped at the registry level.
# This workflow uses the diff to (1) skip the whole job when nothing was
# bumped, (2) create per-feature git tags `<feature>-v<version>` for the
# bumped ones, and (3) dispatch one website rebuild event per bumped feature.

on:
  workflow_dispatch:
    inputs:
      force-all:
        description: "Republish ALL features regardless of version diff (recovery only)"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "src/*/devcontainer-feature.json"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      count: ${{ steps.diff.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the full push range (github.event.before .. HEAD) for diff

      - name: Detect features with bumped version
        id: diff
        shell: bash
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.force-all }}
          # `before` is the SHA prior to the push; for workflow_dispatch it is empty.
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed_json='[]'

          # Manifests use JSONC (line comments) — devcontainers/action tolerates
          # them at publish time, so we do the same here: strip leading `//`
          # comment lines before parsing with jq.
          read_field() {
            local file="$1" filter="$2"
            sed -E 's@^[[:space:]]*//.*$@@' "$file" | jq -r "$filter"
          }

          # Resolve the base ref against which we diff. A push can contain
          # several commits, so HEAD~1..HEAD is unsafe (it only sees the very
          # last commit and would miss manifest bumps pushed earlier in the
          # same batch — see release run #35). We use `github.event.before`
          # which spans the entire push range. Fallbacks cover the
          # workflow_dispatch and initial-push cases.
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "${ZERO_SHA}" ] \
             && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            BASE_REF="${BEFORE_SHA}"
          else
            BASE_REF="HEAD~1"
          fi
          echo "::notice::Diff base = ${BASE_REF} → HEAD ($(git rev-parse HEAD))"

          if [ "${FORCE_ALL}" = "true" ]; then
            echo "::notice::workflow_dispatch with force-all=true → republishing every feature"
            mapfile -t files < <(ls src/*/devcontainer-feature.json 2>/dev/null || true)
          else
            # All feature manifests touched anywhere in the push range.
            mapfile -t files < <(git diff --name-only "${BASE_REF}..HEAD" -- 'src/*/devcontainer-feature.json' || true)
          fi

          for f in "${files[@]}"; do
            [ -f "$f" ] || continue
            name=$(read_field "$f" '.id')
            new_version=$(read_field "$f" '.version')

            if [ "${FORCE_ALL}" = "true" ]; then
              old_version="<forced>"
            else
              # Best-effort previous version (file may not exist on the base ref → new feature)
              old_version=$(git show "${BASE_REF}:$f" 2>/dev/null | sed -E 's@^[[:space:]]*//.*$@@' | jq -r '.version' 2>/dev/null || echo "")
            fi

            if [ "${FORCE_ALL}" != "true" ] && [ "$old_version" = "$new_version" ]; then
              if [ -n "$old_version" ]; then
                # $f is only in $files because devcontainer-feature.json
                # changed somehow — if version itself didn't move, a bump
                # that passed version-bump-check on the PR branch may have
                # been lost during the merge itself (the PR#52 failure mode;
                # see AGENTS.md "Verify version after merge").
                echo "::warning::${name}: devcontainer-feature.json changed but version is still ${new_version} — a version bump may have been lost during merge. See AGENTS.md 'Verify version after merge'."
              fi
              echo "→ $name unchanged ($new_version), skipping"
              continue
            fi

            echo "→ $name: ${old_version:-<new>} → $new_version"
            changed_json=$(jq -c --arg n "$name" --arg v "$new_version" '. + [{name:$n, version:$v}]' <<< "$changed_json")
          done

          count=$(jq 'length' <<< "$changed_json")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "changed=$changed_json" >> "$GITHUB_OUTPUT"
          echo "Detected $count feature(s) to publish."

  release:
    needs: detect
    if: ${{ needs.detect.outputs.count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags, and devcontainers/action's generate-docs commit
      packages: write # GHCR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Log in to the Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish features
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint tag-push token
        id: tag_token
        # A tag whose ref history touches .github/workflows/*.yml gets
        # rejected by GitHub when pushed with GITHUB_TOKEN ("refusing to
        # allow a GitHub App to create or update workflow ... without
        # workflows permission" — hit for real in run 31324555689). There is
        # no `workflows` key under this job's `permissions:` block above —
        # it isn't a valid GITHUB_TOKEN scope, and adding it just makes the
        # whole file schema-invalid (also hit for real, then reverted).
        # Trigganator (used by this same repo's trigger-website job below)
        # doesn't have the Workflows app permission granted. Pushinator does
        # — scoped here to only what this specific push needs.
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.PUSHINATOR_ID }}
          private-key: ${{ secrets.PUSHINATOR_KEY }}
          owner: helpers4
          repositories: devcontainer
          permission-contents: write
          permission-workflows: write

      - name: Create per-feature git tags
        env:
          CHANGED: ${{ needs.detect.outputs.changed }}
          TAG_TOKEN: ${{ steps.tag_token.outputs.token }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${TAG_TOKEN}@github.com/${{ github.repository }}.git"
          echo "$CHANGED" | jq -c '.[]' | while read -r row; do
            name=$(jq -r '.name' <<< "$row")
            version=$(jq -r '.version' <<< "$row")
            tag="${name}-v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
              echo "→ tag ${tag} already exists, skipping"
              continue
            fi
            git tag -a "${tag}" -m "Release ${name} v${version}"
            git push origin "${tag}"
            echo "→ created tag ${tag}"
          done

  trigger-website:
    needs: [detect, release]
    if: ${{ needs.detect.outputs.count != '0' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    # No checkout, no GITHUB_TOKEN use — the composite action mints its own token via the
    # GitHub App credentials passed in `with:`, so the default token needs zero permissions here.
    permissions: {}
    strategy:
      fail-fast: false
      # One dispatch per changed feature so the website workflow can react per-feature —
      # matrix built from detect's JSON output instead of a bash loop over `gh api`.
      matrix:
        feature: ${{ fromJson(needs.detect.outputs.changed) }}
    steps:
      - name: "Trigger website update: ${{ matrix.feature.name }} v${{ matrix.feature.version }}"
        continue-on-error: true
        uses: helpers4/action/dispatch-with-fallback@main
        with:
          target-owner: helpers4
          target-repo: website
          event-type: devcontainer-release
          payload: |
            {
              "feature": "${{ matrix.feature.name }}",
              "version": "${{ matrix.feature.version }}",
              "ref": "${{ github.sha }}",
              "sha": "${{ github.sha }}",
              "source": "devcontainer-release"
            }
          app-id: ${{ vars.TRIGGANATOR_ID }}
          app-private-key: ${{ secrets.TRIGGANATOR_KEY }}
